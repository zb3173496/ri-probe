name: wn-comments
on:
  workflow_dispatch:
    inputs:
      start:
        description: '起始章节序号'
        required: true
        default: '0'
      count:
        description: '本批章节数'
        required: true
        default: '30'
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: scrape chapter comments
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time, random, os, re

          BOOK = '7996858406002505'
          START = int(os.environ.get('START', '0'))
          COUNT = int(os.environ.get('COUNT', '30'))
          result = {'bookId': BOOK, 'start': START, 'chapters': {}, 'blockedAt': None, 'reqs': 0}

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,
                  args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto(f'https://www.webnovel.com/book/{BOOK}', timeout=90000)
              # 主动点击 Turnstile 复选框直到挑战通过
              for i in range(30):
                  time.sleep(2)
                  t = page.title()
                  if 'Reverend' in t:
                      break
                  for f in page.frames:
                      if 'challenges.cloudflare.com' in f.url:
                          try:
                              box = f.frame_element().bounding_box()
                              if box:
                                  page.mouse.move(box['x'] + 30 + 40, box['y'] + box['height']/2, steps=6)
                                  time.sleep(0.2)
                                  page.mouse.move(box['x'] + 30, box['y'] + box['height']/2, steps=5)
                                  page.mouse.down(); time.sleep(0.07); page.mouse.up()
                                  print('TURNSTILE_CLICKED', flush=True)
                                  time.sleep(4)
                          except Exception:
                              pass
              print('BOOK_TITLE:', page.title(), flush=True)

              def api(url):
                  """返回 dict 或 None"""
                  result['reqs'] += 1
                  try:
                      return page.evaluate("""async (u) => {
                          const res = await fetch(u, {headers:{'Accept':'application/json'}});
                          const txt = await res.text();
                          let j=null; try{j=JSON.parse(txt)}catch(e){}
                          return {status: res.status, json: j};
                      }""", url)
                  except Exception:
                      return None

              WARM = [
                  f'https://www.webnovel.com/go/pcm/gift/get-gift-info?bookId={BOOK}&novelType=0',
                  f'https://www.webnovel.com/go/pcm/powerStone/getRankInfoAjax?bookId={BOOK}&bookType=1&novelType=0',
                  'https://www.webnovel.com/go/pcm/pcbookcity/essay',
              ]
              def warmup():
                  for w in WARM:
                      api(w)
                      time.sleep(random.uniform(0.3, 0.7))

              def api_retry(url, tries=4):
                  """403 时先用安全接口热身，再重试；都不行快速放弃"""
                  for att in range(tries):
                      r = api(url)
                      if r and r['json'] is not None and r['json'].get('code') == 0:
                          return r['json']
                      print(f'  retry {att}:', r['status'] if r else 'err', flush=True)
                      warmup()
                      time.sleep(5 + att * 3)
                  return None

              # 章节列表：直接扒书籍页 DOM（含全部章节链接，绕开被封的 get-chapter-list）
              chapters = None
              links = page.evaluate("""() => [...document.querySelectorAll('a')].map(a => ({href: a.getAttribute('href')||'', text: (a.textContent||'').trim()})).filter(x => /\\/book\\/7996858406002505\\/\\d+/.test(x.href))""")
              seen = {}
              chapters = []
              for x in links:
                  m = re.search(r'/book/7996858406002505/(\d+)', x['href'])
                  if not m:
                      continue
                  cid = m.group(1)
                  if cid not in seen:
                      seen[cid] = len(chapters)
                      chapters.append({'id': cid, 'name': x['text']})
                  elif x['text'] and not chapters[seen[cid]]['name']:
                      chapters[seen[cid]]['name'] = x['text']
              print('DOM_CHAPTERS:', len(chapters), flush=True)
              if chapters:
                  print('FIRST_CH:', json.dumps(chapters[0], ensure_ascii=False)[:120], flush=True)
                  print('LAST_CH:', json.dumps(chapters[-1], ensure_ascii=False)[:120], flush=True)
              print('TOTAL_CHAPTERS:', len(chapters), flush=True)
              if not chapters:
                  chapters = []
                  result['blockedAt'] = START
                  with open('comments.json', 'w', encoding='utf-8') as f:
                      json.dump(result, f, ensure_ascii=False)
                  raise SystemExit('no chapters, orchestrator will retry')

              batch = chapters[START:START + COUNT]
              for idx, ch in enumerate(batch):
                  cid = str(ch.get('id') or ch.get('chapterId'))
                  cname = ch.get('name') or ch.get('chapterName') or ''
                  reviews = []
                  ok = True
                  for pg in (1, 2):
                      j = api_retry(f'https://www.webnovel.com/go/pcm/chapterReview/getReviewList?bookId={BOOK}&chapterId={cid}&lastReviewId=0&orderType=1&pageIndex={pg}', tries=4)
                      if not j:
                          ok = False
                          break
                      items = (j.get('data') or {}).get('chapterReviewItems') or []
                      for it in items:
                          reviews.append([it.get('content', ''), it.get('userName', ''),
                                          it.get('likeAmount', 0), it.get('createTimeFormat', ''),
                                          it.get('replyAmount', 0)])
                      if len(items) < 10:
                          break
                      time.sleep(random.uniform(0.3, 0.6))
                  if not ok:
                      result['blockedAt'] = START + idx
                      print('BLOCKED_AT:', START + idx, flush=True)
                      break
                  result['chapters'][cid] = {'name': cname, 'reviews': reviews}
                  done = idx + 1
                  if done % 5 == 0 or done == len(batch):
                      print(f'PROGRESS: {done}/{len(batch)} reqs={result["reqs"]} reviews={sum(len(v["reviews"]) for v in result["chapters"].values())}', flush=True)
                  time.sleep(random.uniform(0.3, 0.7))

              browser.close()

          if chapters:
              result['chapterList'] = chapters
          result['nextStart'] = result['blockedAt'] if result['blockedAt'] is not None else START + len(batch)
          with open('comments.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False)
          print(f"SUMMARY: done={len(result['chapters'])} nextStart={result['nextStart']} reqs={result['reqs']}", flush=True)
          PYEOF
        env:
          START: ${{ github.event.inputs.start }}
          COUNT: ${{ github.event.inputs.count }}
      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wn-comments-${{ github.event.inputs.start }}
          path: comments.json

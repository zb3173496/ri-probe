name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: install warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp 2>&1 | tail -1
      - name: warp connect + probe api
        run: |
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status
          echo "--- exit ip:"
          curl -s -x socks5h://127.0.0.1:40000 --max-time 20 https://cloudflare.com/cdn-cgi/trace | head -6
          echo "--- book page via warp:"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -s -x socks5h://127.0.0.1:40000 --max-time 30 -c /tmp/ck.txt -A "$UA" -o /dev/null -w "book: %{http_code}\n" "https://www.webnovel.com/book/7996858406002505"
          echo "--- api via warp:"
          curl -s -x socks5h://127.0.0.1:40000 --max-time 30 -b /tmp/ck.txt -A "$UA" -H "Accept: application/json" -H "Referer: https://www.webnovel.com/book/7996858406002505" -w "\napi_status: %{http_code}\n" "https://www.webnovel.com/apiajax/chapter/GetChapterList?bookId=7996858406002505" | head -c 500

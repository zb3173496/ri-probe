name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: extract fockPath from wayback chapter page
        run: |
          curl -sL --max-time 60 "https://web.archive.org/web/2025id_/https://www.webnovel.com/book/7996858406002505/21533585005668024" -o /tmp/wb.html -w "status:%{http_code} size:%{size_download}\n"
          echo "--- fockPath:"
          grep -o 'fockPath[^,}]*' /tmp/wb.html | head -3
          echo "--- g_data head:"
          grep -o 'g_data={.\{0,600\}' /tmp/wb.html | head -c 700
          echo
          echo "--- any fock url:"
          grep -o 'https://[^"]*fock[^"]*' /tmp/wb.html | head -5

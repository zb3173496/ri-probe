name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: wayback reader html + bundle mining
        run: |
          echo "--- wayback chapter page:"
          curl -sL --max-time 60 "https://web.archive.org/web/2025/https://www.webnovel.com/book/7996858406002505/21533585005668024" -o /tmp/wb.html -w "wb_status: %{http_code} size: %{size_download}\n"
          grep -o 'https://www.yueimg.com/en/js/[^"]*\.js' /tmp/wb.html | sort -u | head -30
          echo "--- fallback: wayback book page bundles:"
          curl -sL --max-time 60 "https://web.archive.org/web/2025/https://www.webnovel.com/book/7996858406002505" -o /tmp/wb2.html -w "wb2_status: %{http_code} size: %{size_download}\n"
          grep -o 'https://www.yueimg.com/en/js/[^"]*\.js' /tmp/wb2.html | sort -u | head -30
      - name: grep bundles for comment endpoints
        run: |
          mkdir -p /tmp/js
          for u in $(grep -ho 'https://www.yueimg.com/en/js/[^"]*\.js' /tmp/wb.html /tmp/wb2.html 2>/dev/null | sort -u); do
            curl -sL --max-time 30 "$u" -o "/tmp/js/$(basename $u)"
          done
          ls /tmp/js | head
          echo "--- comment-ish endpoints:"
          grep -rho '"/go/[A-Za-z0-9_/\-]\+"' /tmp/js | sort -u | head -40
          echo "--- paragraph/comment keywords:"
          grep -rho '[A-Za-z]*[Pp]aragraph[A-Za-z]*\|[A-Za-z]*[Cc]omment[A-Za-z]*' /tmp/js | sort | uniq -c | sort -rn | head -25

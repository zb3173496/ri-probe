name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: mine js bundles for comment endpoints
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time, re

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,
                  args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=90000)
              for i in range(20):
                  time.sleep(2)
                  if 'Reverend' in page.title():
                      break
              print('BOOK_TITLE:', page.title(), flush=True)
              time.sleep(4)

              # 收集 JS 文件地址
              scripts = page.evaluate("""() => [...document.scripts].map(s => s.src).filter(s => s && s.includes('webnovel'))""")
              print('SCRIPTS:', len(scripts), flush=True)

              # 从页面上下文 fetch 每个 JS，挖 /go/pcm/ 和 comment/review 相关路径
              eps = set()
              for src in scripts[:30]:
                  try:
                      txt = page.evaluate("""async (u) => {
                        const r = await fetch(u);
                        return r.text();
                      }""", src)
                      for m in re.findall(r'/(?:go|apiajax)/[A-Za-z0-9_/\-]{3,80}', txt):
                          if re.search(r'comment|review|note|thought', m, re.I):
                              eps.add(m)
                  except Exception as e:
                      pass
              print('ENDPOINTS:', json.dumps(sorted(eps)[:40], ensure_ascii=False), flush=True)

              # 测试书评接口（已知能用）
              csrf = [c['value'] for c in ctx.cookies('https://www.webnovel.com') if c['name'] == '_csrfToken']
              csrf = csrf[0] if csrf else ''
              r = page.evaluate("""async (u) => {
                  const res = await fetch(u, {headers:{'Accept':'application/json'}});
                  const txt = await res.text();
                  return {status: res.status, head: txt.slice(0,200)};
              }""", f'https://www.webnovel.com/go/pcm/bookReview/get-reviews?_csrfToken={csrf}&bookId=7996858406002505&pageIndex=1&pageSize=3&orderBy=1&novelType=0&needSummary=1')
              print('REVIEW_TEST:', json.dumps(r, ensure_ascii=False)[:300], flush=True)
              browser.close()
          PYEOF

name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: chapter list plaintext check
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,
                  args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=90000)
              time.sleep(8)
              # 直接打章节列表接口（不依赖页面挑战通过）
              for att in range(5):
                  r = page.evaluate("""async () => {
                      const res = await fetch('https://www.webnovel.com/go/pcm/chapter/get-chapter-list?bookId=7996858406002505&pageIndex=0&encryptType=1', {headers:{'Accept':'application/json'}});
                      const txt = await res.text();
                      let j=null; try{j=JSON.parse(txt)}catch(e){}
                      if (!j) return {status: res.status, head: txt.slice(0,80)};
                      const d = j.data || {};
                      return {status: res.status,
                              keys: Object.keys(d),
                              total: d.chapterTotal,
                              firstItems: d.chapterItems ? d.chapterItems.slice(0,3) : null};
                  }""")
                  if r.get('firstItems'):
                      break
                  print('ATT', att, 'fail:', r.get('status'), r.get('head','')[:60], flush=True)
                  time.sleep(6)
              print('CHLIST_STRUCT:', json.dumps(r, ensure_ascii=False)[:900], flush=True)
              browser.close()
          PYEOF

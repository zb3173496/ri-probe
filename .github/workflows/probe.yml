name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright -q
          playwright install chromium --with-deps
      - name: probe
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=60000)
              # 等 cf_clearance cookie 出现（挑战真正完成）
              cleared = False
              for i in range(40):
                  time.sleep(2)
                  t = page.title()
                  cookies = ctx.cookies('https://www.webnovel.com')
                  names = [c['name'] for c in cookies]
                  if 'cf_clearance' in names:
                      cleared = True
                      print('CLEARED at iter', i, 'title:', t, flush=True)
                      break
              print('COOKIES:', [c['name'] for c in ctx.cookies('https://www.webnovel.com')], flush=True)
              if cleared:
                  time.sleep(2)
                  r = page.evaluate("""async () => {
                    const out = {};
                    const urls = {
                      chlist: '/apiajax/chapter/GetChapterList?bookId=7996858406002505',
                      review: '/apiajax/ChapterReview/GetChapterReviewsAjax?bookId=7996858406002505&chapterId=42481155747927422&pageIndex=1&orderBy=1',
                    };
                    for (const [k,u] of Object.entries(urls)) {
                      try {
                        const res = await fetch(u, {headers:{'Accept':'application/json'}});
                        const txt = await res.text();
                        let j=null; try{j=JSON.parse(txt)}catch(e){}
                        out[k] = {status: res.status, isJson: !!j, head: txt.slice(0,150)};
                        if (j) out[k].data = JSON.stringify(j).slice(0,300);
                      } catch(e) { out[k] = {err: String(e).slice(0,100)}; }
                    }
                    return out;
                  }""")
                  print('API_RETRY:', json.dumps(r, ensure_ascii=False), flush=True)
              # 移动端域名测试
              page2 = ctx.new_page()
              try:
                  r2 = page2.goto('https://m.webnovel.com/book/7996858406002505', timeout=40000)
                  time.sleep(6)
                  print('M_SITE:', r2.status if r2 else 'none', page2.title()[:60], flush=True)
              except Exception as e:
                  print('M_SITE_ERR:', str(e)[:120], flush=True)
              browser.close()
          PYEOF

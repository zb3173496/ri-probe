name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cdx v2
        run: |
          echo "--- exact host prefix:"
          curl -sL --max-time 60 "http://web.archive.org/cdx/search/cdx?url=www.webnovel.com/book/7996858406002505&matchType=prefix&output=text&limit=50&collapse=urlkey" | head -50
          echo "--- catalog exact:"
          curl -sL --max-time 40 "http://web.archive.org/cdx/search/cdx?url=www.webnovel.com/book/7996858406002505/catalog&output=text&limit=10" | head -10

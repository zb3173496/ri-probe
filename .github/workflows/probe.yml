name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: install warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp 2>&1 | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: warp + playwright api test
        run: |
          sudo warp-cli --accept-tos status || true
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,
                  proxy={'server': 'socks5://127.0.0.1:40000'},
                  args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=90000)
              for i in range(30):
                  time.sleep(2)
                  if 'Reverend' in page.title():
                      break
              print('BOOK_TITLE:', page.title(), flush=True)
              if 'Reverend' in page.title():
                  time.sleep(3)
                  r = page.evaluate("""async () => {
                    const out = {};
                    const urls = {
                      chlist: '/apiajax/chapter/GetChapterList?bookId=7996858406002505',
                      review: '/apiajax/ChapterReview/GetChapterReviewsAjax?bookId=7996858406002505&chapterId=42481155747927422&pageIndex=1&orderBy=1',
                    };
                    for (const [k,u] of Object.entries(urls)) {
                      try {
                        const res = await fetch(u, {headers:{'Accept':'application/json'}});
                        const txt = await res.text();
                        let j=null; try{j=JSON.parse(txt)}catch(e){}
                        out[k] = {status: res.status, isJson: !!j, head: txt.slice(0,200)};
                        if (j) out[k].jsonHead = JSON.stringify(j).slice(0,400);
                      } catch(e) { out[k] = {err: String(e).slice(0,100)}; }
                    }
                    return out;
                  }""")
                  print('API_RESULT:', json.dumps(r, ensure_ascii=False), flush=True)
              browser.close()
          PYEOF

          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status
          echo "--- exit ip:"
          curl -s -x socks5h://127.0.0.1:40000 --max-time 20 https://cloudflare.com/cdn-cgi/trace | head -6
          echo "--- book page via warp:"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -s -x socks5h://127.0.0.1:40000 --max-time 30 -c /tmp/ck.txt -A "$UA" -o /dev/null -w "book: %{http_code}\n" "https://www.webnovel.com/book/7996858406002505"
          echo "--- api via warp:"
          curl -s -x socks5h://127.0.0.1:40000 --max-time 30 -b /tmp/ck.txt -A "$UA" -H "Accept: application/json" -H "Referer: https://www.webnovel.com/book/7996858406002505" -w "\napi_status: %{http_code}\n" "https://www.webnovel.com/apiajax/chapter/GetChapterList?bookId=7996858406002505" | head -c 500

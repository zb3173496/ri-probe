name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: search engines chapter urls
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== DDG:"
          for p in 0 1 2; do
            curl -sL --max-time 25 -A "$UA" "https://html.duckduckgo.com/html/?q=site%3Awebnovel.com%2Fbook%2F7996858406002505&s=$((p*30))" -o /tmp/ddg$p.html
            sleep 2
          done
          grep -hoE 'book/7996858406002505/[0-9]+' /tmp/ddg*.html | sort -u | wc -l
          grep -hoE 'book/7996858406002505/[0-9]+' /tmp/ddg*.html | sort -u | head -8
          echo "=== Bing:"
          for p in 1 31 61; do
            curl -sL --max-time 25 -A "$UA" "https://www.bing.com/search?q=site%3Awebnovel.com%2Fbook%2F7996858406002505&count=30&first=$p" -o /tmp/bing$p.html
            sleep 2
          done
          grep -hoE 'book/7996858406002505/[0-9]+' /tmp/bing*.html | sort -u | wc -l
          grep -hoE 'book/7996858406002505/[0-9]+' /tmp/bing*.html | sort -u | head -8

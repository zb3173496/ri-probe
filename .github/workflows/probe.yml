name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe webnovel
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          BID=7996858406002505
          CID=42481155747927422
          curl -s -c ck.txt -A "$UA" "https://www.webnovel.com/book/$BID" -o /dev/null -w "bookpage: %{http_code}\n"
          TOKEN=$(grep "_csrfToken" ck.txt | awk '{print $7}')
          echo "csrf: ${TOKEN:0:12}"
          echo "== GetChapterList =="
          curl -s -b ck.txt -A "$UA" "https://www.webnovel.com/apiajax/chapter/GetChapterList?_csrfToken=$TOKEN&bookId=$BID" | head -c 400; echo
          echo "== GetChapterReviewsAjax =="
          curl -s -b ck.txt -A "$UA" "https://www.webnovel.com/apiajax/ChapterReview/GetChapterReviewsAjax?_csrfToken=$TOKEN&bookId=$BID&chapterId=$CID&pageIndex=1&orderBy=1" | head -c 400; echo
          echo "== 段评接口候选 =="
          for ep in \
            "ParagraphReview/GetParagraphReviewsAjax" \
            "ParagraphReview/GetParagraphReviewList" \
            "chapter/GetParagraphReviewsAjax" \
            "ChapterReview/GetParagraphReviewsAjax" \
            "comment/GetParagraphComments" \
            "ParagraphComment/GetParagraphCommentsAjax" \
            "book/GetParagraphReviewsAjax" \
            ; do
            R=$(curl -s -b ck.txt -A "$UA" "https://www.webnovel.com/apiajax/$ep?_csrfToken=$TOKEN&bookId=$BID&chapterId=$CID&paragraphId=1&pageIndex=1&orderBy=1" | head -c 120)
            echo "$ep => $R"
          done

name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright -q
          playwright install chromium --with-deps
      - name: probe
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=60000)
              for i in range(10):
                  time.sleep(3)
                  t = page.title()
                  if 'Just a moment' not in t and t:
                      break
              print('TITLE:', t, flush=True)
              time.sleep(5)
              # 直接导航到 API
              r = page.goto('https://www.webnovel.com/apiajax/chapter/GetChapterList?bookId=7996858406002505', timeout=30000)
              body = page.evaluate('() => document.body.innerText')
              print('NAV_STATUS:', r.status, flush=True)
              print('BODY_HEAD:', body[:300], flush=True)
              browser.close()
          PYEOF

name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright -q
          playwright install chromium --with-deps
      - name: probe
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=60000)
              for i in range(10):
                  time.sleep(3)
                  t = page.title()
                  if 'Just a moment' not in t and t:
                      break
              print('TITLE:', t)
              r = page.evaluate("""async () => {
                const csrf = (document.cookie.split(';').find(e=>e.includes('_csrfToken'))||'').split('=')[1]||'';
                const out = {csrfLen: csrf.length, results: {}};
                const bids = ['7996858406002505'];
                const urls = {
                  chlist1: '/apiajax/chapter/GetChapterList?_csrfToken='+csrf+'&bookId=7996858406002505',
                  chlist2: '/apiajax/chapter/GetChapterList?bookId=7996858406002505&_csrfToken='+csrf+'&_='+Date.now(),
                  review1: '/apiajax/ChapterReview/GetChapterReviewsAjax?_csrfToken='+csrf+'&bookId=7996858406002505&chapterId=42481155747927422&pageIndex=1&orderBy=1&_='+Date.now(),
                };
                for (const [k,u] of Object.entries(urls)) {
                  try {
                    const res = await fetch(u, {headers:{'Accept':'application/json'}});
                    const txt = await res.text();
                    out.results[k] = {status: res.status, head: txt.slice(0,120)};
                  } catch(e) { out.results[k] = {err: String(e).slice(0,100)}; }
                }
                return out;
              }""")
              print(json.dumps(r, ensure_ascii=False, indent=1))
              browser.close()
          PYEOF

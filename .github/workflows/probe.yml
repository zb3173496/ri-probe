name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: raw response dump
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time

          API = 'https://www.webnovel.com/apiajax/chapter/GetChapterList?bookId=7996858406002505'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,
                  args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              resp = page.goto(API, timeout=90000)
              print('STATUS:', resp.status, flush=True)
              print('HEADERS_CT:', resp.headers.get('content-type'), flush=True)
              time.sleep(6)
              body = page.evaluate('() => document.body ? document.body.innerText.slice(0,80) : ""')
              # 等待挑战完成（点击 turnstile）
              for i in range(15):
                  if 'Just a moment' not in body and 'security verification' not in body and 'Verify you are' not in body:
                      break
                  for f in page.frames:
                      if 'challenges.cloudflare.com' in f.url:
                          try:
                              box = f.frame_element().bounding_box()
                              if box:
                                  page.mouse.click(box['x'] + 30, box['y'] + box['height']/2)
                                  time.sleep(4)
                          except Exception:
                              pass
                  time.sleep(3)
                  body = page.evaluate('() => document.body ? document.body.innerText.slice(0,80) : ""')
              html = page.content()
              print('FINAL_URL:', page.url, flush=True)
              print('HTML_LEN:', len(html), flush=True)
              print('HTML_HEAD:', html[:400].replace(chr(10), ' ')[:400], flush=True)
              browser.close()
          PYEOF

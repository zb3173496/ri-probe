name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright -q
          playwright install chromium --with-deps
      - name: probe
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=60000)
              for i in range(20):
                  time.sleep(2)
                  if 'Reverend' in page.title():
                      break
              # 找一个章节页，看服务端渲染里有没有评论数据
              r = page.evaluate("""async () => {
                const res = await fetch('/apiajax/chapter/GetChapterList?bookId=7996858406002505', {headers:{'Accept':'application/json'}});
                const txt = await res.text();
                return {status: res.status, head: txt.slice(0,80)};
              }""")
              print('CHLIST_VIA_FETCH:', json.dumps(r), flush=True)
              # 直接访问第一章页面（服务端渲染 HTML）
              page.goto('https://www.webnovel.com/book/7996858406002505/42481155747927422', timeout=60000)
              for i in range(15):
                  time.sleep(2)
                  t = page.title()
                  if 'Just a moment' not in t and t:
                      break
              print('CH_TITLE:', t, flush=True)
              html = page.content()
              print('CH_HTML_LEN:', len(html), flush=True)
              # 找内嵌 JSON / 评论关键词
              for kw in ['review', 'Review', 'comment', 'Comment', '__NEXT_DATA__', 'chapterReview']:
                  idx = html.find(kw)
                  print('KW', kw, ':', idx, flush=True)
              idx = html.find('__NEXT_DATA__')
              if idx >= 0:
                  nd = page.evaluate("() => { const e=document.getElementById('__NEXT_DATA__'); return e? e.textContent.slice(0,600):''; }")
                  print('NEXT_DATA_HEAD:', nd[:500], flush=True)
              browser.close()
          PYEOF

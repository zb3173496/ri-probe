name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: commoncrawl chapter urls
        run: |
          echo "--- CC indexes:"
          curl -sL --max-time 30 "https://index.commoncrawl.org/collinfo.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'], d[0]['name'])"
          IDX=$(curl -sL --max-time 30 "https://index.commoncrawl.org/collinfo.json" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "using index: $IDX"
          echo "--- query chapter urls:"
          curl -sL --max-time 60 "https://index.commoncrawl.org/$IDX-index?url=webnovel.com/book/7996858406002505/*&output=json&filter=status:200" -o /tmp/cc.json -w "status:%{http_code} size:%{size_download}\n"
          grep -oE '/book/7996858406002505/[0-9]+' /tmp/cc.json | sort -u | head -20
          grep -oE '/book/7996858406002505/[0-9]+' /tmp/cc.json | sort -u | wc -l

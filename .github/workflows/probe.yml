name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: wayback catalog hunt
        run: |
          echo "--- CDX: catalog pages"
          curl -sL --max-time 40 "http://web.archive.org/cdx/search/cdx?url=webnovel.com/book/7996858406002505*&output=text&limit=40&collapse=urlkey" | head -40

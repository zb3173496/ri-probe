name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dig sitemap for chapter urls
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "--- sitemap index:"
          curl -sL --max-time 30 -A "$UA" "https://www.webnovel.com/sitemap/sitemap.xml" -o /tmp/sm.xml -w "status: %{http_code} size: %{size_download}\n"
          head -c 500 /tmp/sm.xml
          echo
          echo "--- find book 7996858406002505 sitemap:"
          grep -o 'https://[^<]*7996858406002505[^<]*' /tmp/sm.xml | head -5
          grep -oE '<loc>[^<]+</loc>' /tmp/sm.xml | head -10

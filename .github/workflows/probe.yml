name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: test go/pcm endpoints
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,
                  args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='en-US')
              page = ctx.new_page()
              page.goto('https://www.webnovel.com/book/7996858406002505', timeout=90000)
              for i in range(20):
                  time.sleep(2)
                  if 'Reverend' in page.title():
                      break
              print('BOOK_TITLE:', page.title(), flush=True)
              time.sleep(4)

              def api(url):
                  r = page.evaluate("""async (u) => {
                      const res = await fetch(u, {headers:{'Accept':'application/json'}});
                      const txt = await res.text();
                      return {status: res.status, head: txt.slice(0,180)};
                  }""", url)
                  print('API', url.split('?')[0][-45:], '=>', r['status'], r['head'][:120].replace('\n',' '), flush=True)
                  return r

              api('https://www.webnovel.com/go/pcm/chapter/get-chapter-list?bookId=7996858406002505&pageIndex=0&encryptType=1')
              api('https://www.webnovel.com/go/pcm/chapterReview/getReviewList?bookId=7996858406002505&chapterId=21533585005668024&lastReviewId=0&orderType=1&pageIndex=1')
              nav = page.goto('https://www.webnovel.com/go/pcm/chapterReview/getReviewList?bookId=7996858406002505&chapterId=21533585005668024&lastReviewId=0&orderType=1&pageIndex=1', timeout=60000)
              print('NAV_STATUS:', nav.status, flush=True)
              time.sleep(8)
              body = page.evaluate('() => { const p = document.querySelector("pre"); return p ? p.textContent.slice(0,250) : document.body.innerText.slice(0,120); }')
              print('NAV_BODY:', body[:200].replace('\n',' '), flush=True)
              browser.close()
          PYEOF
